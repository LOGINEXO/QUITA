[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quita-platform"
version = "0.2.0"
description = "Plataforma QUITA com backend FastAPI e persistência PostgreSQL"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "PyJWT>=2.9,<3.0",
  "redis>=5.2,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.7,<1.0"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
