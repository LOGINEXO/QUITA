services:
  - type: web
    name: quita-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -e ".[dev]" && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: quita-postgres
          property: connectionString
      - key: QUITA_ADMIN_API_KEY
        generateValue: true
      - key: QUITA_REQUEST_TIMEOUT_SECONDS
        value: "8"

databases:
  - name: quita-postgres
    databaseName: quita
    user: quita_app
    plan: free
    region: oregon
    ipAllowList: []
